name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cortex
          POSTGRES_PASSWORD: cortex
          POSTGRES_DB: cortex_test
        ports:
          - 5434:5432

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: cortex/backend
        run: |
          pip install -r requirements.txt

      - name: Create database tables
        working-directory: cortex/backend
        run: |
          python -c "
          import asyncio
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine
          from app.db.models import Base

          async def create_tables():
              engine = create_async_engine('postgresql+asyncpg://cortex:cortex@localhost:5434/cortex_test')
              async with engine.begin() as conn:
                  await conn.execute(text('CREATE EXTENSION IF NOT EXISTS vector'))
                  await conn.run_sync(Base.metadata.create_all)
              await engine.dispose()

          asyncio.run(create_tables())
          "

      - name: Run tests
        working-directory: cortex/backend
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        working-directory: cortex/backend
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/cortex-backend
          docker build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}